# Phase-4 review gate chain (docs/process/development-cycle.md), poured once per story.
# Usage:  bd mol pour gate-chain --var story=sov-abc --var scope="<commit range>"
# Preview: bd cook gate-chain --var story=sov-abc --var scope=HEAD~1..HEAD --dry-run
formula = "gate-chain"
description = "Phase-4 gates for one story: wiring audit, ledger invariants (economy diffs), adversarial review, domain sign-off"
version = 2
type = "workflow"

[vars.story]
required = true
description = "Story/ticket id under review (e.g. sov-abc)"

[vars.scope]
required = true
description = "Diff scope: commit range, staged, or working tree"

[[steps]]
id = "wiring"
title = "Wiring audit {{story}}: is {{scope}} reachable from the running game?"
type = "task"

[[steps]]
id = "ledger"
title = "Ledger invariant check {{story}}: quantity/money conserved across {{scope}}? Close as skipped if the diff touches no economy seam"
type = "task"
needs = ["wiring"]

[[steps]]
id = "review"
title = "Adversarial review (fable@medium) of {{story}} ({{scope}})"
type = "task"
needs = ["ledger"]

[[steps]]
id = "domain"
title = "Domain gate sign-off for {{story}} — only when the diff diverged from the Phase 0 answer; close as skipped otherwise"
type = "task"
needs = ["review"]
